name: Feature request
description: Suggest a new format, option, or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for Verto? Great — please describe it below.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I always have to... / It's annoying when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Describe what you'd like to see in the app.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Did you consider another approach? Why not?

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This feature fits Verto's scope (local file conversion, no internet).
          required: true
