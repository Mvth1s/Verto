name: Release

on:
  push:
    branches: [main]

# Requires: lint and build must pass first (enforced via needs or branch protection)

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-22.04

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Download Pandoc sidecar (Linux / macOS)
        if: matrix.platform.os != 'windows-latest'
        run: bash apps/desktop/scripts/download-pandoc.sh

      - name: Download Pandoc sidecar (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: pwsh apps/desktop/scripts/download-pandoc.ps1

      - name: Download FFmpeg sidecar (Linux / macOS)
        if: matrix.platform.os != 'windows-latest'
        run: bash apps/desktop/scripts/download-ffmpeg.sh

      - name: Download FFmpeg sidecar (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: pwsh apps/desktop/scripts/download-ffmpeg.ps1

      - name: Generate icon.icns (macOS)
        if: startsWith(matrix.platform.os, 'macos')
        run: |
          mkdir -p apps/desktop/src-tauri/icons/icon.iconset
          sips -z 16 16   apps/desktop/src-tauri/icons/icon.png --out apps/desktop/src-tauri/icons/icon.iconset/icon_16x16.png
          sips -z 32 32   apps/desktop/src-tauri/icons/icon.png --out apps/desktop/src-tauri/icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32   apps/desktop/src-tauri/icons/icon.png --out apps/desktop/src-tauri/icons/icon.iconset/icon_32x32.png
          sips -z 64 64   apps/desktop/src-tauri/icons/icon.png --out apps/desktop/src-tauri/icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 apps/desktop/src-tauri/icons/icon.png --out apps/desktop/src-tauri/icons/icon.iconset/icon_128x128.png
          sips -z 256 256 apps/desktop/src-tauri/icons/icon.png --out apps/desktop/src-tauri/icons/icon.iconset/icon_128x128@2x.png
          iconutil -c icns apps/desktop/src-tauri/icons/icon.iconset -o apps/desktop/src-tauri/icons/icon.icns

      - name: Install dependencies
        run: pnpm install

      - name: Sync version from Semantic Release to tauri.conf.json
        shell: bash
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.NEW_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            console.log('tauri.conf.json version set to', process.env.NEW_VERSION);
          "

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.platform.target }}
          tagName: v${{ needs.release.outputs.new_release_version }}
          releaseName: Verto v${{ needs.release.outputs.new_release_version }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: false
          prerelease: false
